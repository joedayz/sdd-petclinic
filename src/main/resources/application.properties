quarkus.application.name=sdd-petclinic

# Database
quarkus.datasource.db-kind=postgresql

# jOOQ
quarkus.jooq.dialect=POSTGRES

# Flyway runs migrations on startup
quarkus.flyway.migrate-at-start=true

# Dev Services starts PostgreSQL automatically in dev and test mode
%dev.quarkus.datasource.devservices.image-name=postgres:17-alpine
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine

# Vaadin
%dev.vaadin.launch-browser=true
